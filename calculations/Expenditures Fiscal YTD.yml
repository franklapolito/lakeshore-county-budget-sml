unique_name: Expenditures Fiscal YTD
object_type: metric_calc
label: Expenditures Fiscal YTD
description: 'Expenditures from 1 December of the fiscal year through the selected fiscal month or quarter.
  Needs a level of the Fiscal Calendar hierarchy in the query. At FY2026 M11 (Oct 2026): $3.649B all funds.'
expression: CASE WHEN ISEMPTY([Measures].[Expenditures]) THEN NULL ELSE Aggregate(PeriodsToDate([Date
  Dimension].[Fiscal Calendar].[Fiscal Year], [Date Dimension].[Fiscal Calendar].CurrentMember), [Measures].[Expenditures])
  END
format: $#,##0
