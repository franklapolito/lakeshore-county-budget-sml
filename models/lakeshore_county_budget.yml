unique_name: lakeshore_county_budget
object_type: model
label: Lakeshore County Budget
description: Budget versus actual for Lakeshore County, a fictional large metropolitan county, defined
  once and served to every BI tool and AI agent. The county's fiscal year runs 1 December to 30 November
  and is named for the calendar year it ends in; all budget reporting uses the Fiscal Calendar hierarchy,
  and a Calendar hierarchy is kept only to show the difference. Data is as of 31 October 2026 (FY2026
  month 11 of 12). Adopted Budget is the adopted appropriation allotted across the twelve fiscal months;
  Adjusted Budget adds amendments and is the figure every variance is measured against. Budget Variance
  is Adjusted Budget minus Expenditures, negative when over budget; through October it is the year-to-date
  test. Budgeted, Filled and Vacant Positions are month-end balances that take the last month in any period
  and are never summed across months. Prior-fiscal-year and fiscal year-to-date measures resolve at Fiscal
  Year, Fiscal Quarter and Fiscal Month. Revenue (budget, actual, variance, net position) is by fund and
  revenue source, never by department. Positions carry a position class (sworn, civilian, clinical, administrative,
  skilled trades).
visible: true
