unique_name: DIM_DATE
object_type: dataset
label: DIM_DATE
description: One row per day, 2022-12-01 to 2026-11-30, carrying a calendar hierarchy and a fiscal hierarchy.
  The fiscal year runs 1 December to 30 November and is named for the calendar year it ends in (FY2026
  = 2025-12-01 to 2026-11-30). The PRIOR_*_KEY columns hold the same quarter or month one year earlier
  at that level's own grain and drive ParallelPeriod.
